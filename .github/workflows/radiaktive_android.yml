name: Mi Android CI Manual

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-24.04

    # Añadimos variables de entorno para evitar timeouts en Gradle
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connection.timeout=60000 -Dorg.gradle.internal.http.socket.timeout=60000"

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compilar APK (${{ github.event.inputs.build_type || 'debug' }})
      run: ./gradlew assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-configuration-cache -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000
      
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest -q --no-configuration-cache

    - name: Extraer versionName y renombrar APK
      run: |
        # Buscar automáticamente cualquier archivo build.gradle o build.gradle.kts en el proyecto
        GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -m 1 "app" || find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        
        VERSION_NAME="unknown"
        if [ -n "$GRADLE_FILE" ] && [ -f "$GRADLE_FILE" ]; then
          echo "Archivo Gradle encontrado en: $GRADLE_FILE"
          VERSION_NAME=$(grep -m 1 "versionName" "$GRADLE_FILE" | sed 's/.*versionName[[:space:]]*=[[:space:]]*//;s/.*versionName[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d ' ')
        fi
        
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="unknown"
        fi
        
        echo "VersionName detectado: $VERSION_NAME"

        # Crear carpeta de distribución usando la zona horaria de Madrid
        TIMESTAMP=$(TZ='Europe/Madrid' date +'%Y%m%d_%H%M%S')
        mkdir -p dist-apk
        
        BUILD_TYPE_LOWER=$(echo "${{ github.event.inputs.build_type || 'debug' }}" | tr '[:upper:]' '[:lower:]')
        
        # Buscar el APK generado de forma dinámica en cualquier subcarpeta de outputs
        APK_FILE=$(find . -path "*/build/outputs/apk/$BUILD_TYPE_LOWER/*.apk" | head -n 1)
        
        if [ -f "$APK_FILE" ]; then
          echo "APK encontrado en: $APK_FILE"
          cp "$APK_FILE" dist-apk/app-$BUILD_TYPE_LOWER-v$VERSION_NAME-$TIMESTAMP.apk
          echo "APK copiado y renombrado con éxito."
        else
          echo "Error crítico: No se ha podido localizar el archivo APK compilado en las rutas de salida."
          exit 1
        fi
    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: apk-versionado
        path: dist-apk/*.apk
