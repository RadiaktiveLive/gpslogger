name: Mi Android CI Manual

on:
  workflow_dispatch: # Esto añade el botón para ejecutarlo manualmente
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Dar permisos a Gradle Wrapper
      run: chmod +x gradlew

    - name: Compilar APK (${{ github.event.inputs.build_type || 'debug' }})
      run: ./gradlew assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-configuration-cache
      
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest -q --no-configuration-cache
