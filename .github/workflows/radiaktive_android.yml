name: Mi Android CI Manual

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compilar APK (${{ github.event.inputs.build_type || 'debug' }})
      run: ./gradlew assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-configuration-cache -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000
      
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest -q --no-configuration-cache

    - name: Extraer versionName y renombrar APK
      run: |
        # Detectar si usa build.gradle o build.gradle.kts en el módulo app
        GRADLE_FILE="app/build.gradle"
        if [ ! -f "$GRADLE_FILE" ]; then
          GRADLE_FILE="app/build.gradle.kts"
        fi

        # Extraer el valor de versionName (ej: "1.0.2" o 1.0.2)
        VERSION_NAME=$(grep -m 1 "versionName" "$GRADLE_FILE" | sed 's/.*versionName[[:space:]]*=[[:space:]]*//;s/.*versionName[[:space:]]*//' | tr -d '"' | tr -d "'" | tr -d ' ')
        
        # Si por alguna razón no lo encuentra, asignar un valor por defecto
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="unknown"
        fi

        echo "VersionName detectado: $VERSION_NAME"

        # Crear carpeta de distribución y copiar con nombre personalizado
        TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        mkdir -p dist-apk
        
        # Seleccionar la ruta del APK según sea debug o release
        BUILD_TYPE_LOWER=$(echo "${{ github.event.inputs.build_type || 'debug' }}" | tr '[:upper:]' '[:lower:]')
        cp app/build/outputs/apk/$BUILD_TYPE_LOWER/app-$BUILD_TYPE_LOWER.apk dist-apk/app-$BUILD_TYPE_LOWER-v$VERSION_NAME-$TIMESTAMP.apk

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: apk-versionado
        path: dist-apk/*.apk
