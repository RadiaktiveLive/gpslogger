name: Mi Android CI Manual

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-24.04

    # Añadimos variables de entorno para evitar timeouts en Gradle
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connection.timeout=60000 -Dorg.gradle.internal.http.socket.timeout=60000"

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4 # Acción oficial que evita errores 504 en la descarga del wrapper

    - name: Dar permisos a Gradle Wrapper
      run: chmod +x gradlew

    - name: Compilar APK (${{ github.event.inputs.build_type || 'debug' }})
      run: ./gradlew assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-configuration-cache
      
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest -q --no-configuration-cache
